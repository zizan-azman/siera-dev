<maine-layout-default [bgColor]="'default'" [spacing]="'small'">
  <maine-hero-default
    [heroDefaultData]="heroDefaultMockData"
  ></maine-hero-default>
</maine-layout-default>
<maine-layout-default [bgColor]="'subtle'" [spacing]="'small'">
  @for(item of cardTeasersMockData; track item ){
  <maine-card-teaser [cardTeaserData]="item"></maine-card-teaser>
  }
</maine-layout-default>
<maine-layout-default [bgColor]="'default'" [spacing]="'small'">
  <maine-news-teaser-default
    [newsTeaserDefaultData]="newsTeaserDefaultMockData"
  ></maine-news-teaser-default>
</maine-layout-default>
<maine-layout-image
  [layoutImageData]="layoutImageMockData"
></maine-layout-image>
<maine-layout-default [bgColor]="'default'" [spacing]="'small'">
  <maine-card-teaser-sticky
    [cardTeaserStickyData]="cardTeaserStickyMockData"
  ></maine-card-teaser-sticky>
</maine-layout-default>
<maine-layout-default [bgColor]="'subtle'" [spacing]="'small'">
  <maine-card-teaser
    [cardTeaserData]="cardGhostTeaserMockData"
  ></maine-card-teaser>
</maine-layout-default>
