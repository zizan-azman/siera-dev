<div class="ma-hero-default ma-custom-grid-layout">
  <div class="ma-hero-default__heading" [innerHTML]="safeHeadingText()"></div>
  <img
    class="ma-hero-default__image"
    [ngSrc]="'maine-assets/' + heroDefaultData.heroImage.imagePath"
    [alt]="heroDefaultData.heroImage.imagePath"
    width="720"
    height="720"
    [priority]="heroDefaultData.heroImage.imagePriority"
  />
  <div class="ma-hero-default__content-middle-container">
    <p>
      {{ heroDefaultData.heroContentMiddle.contentText }}
    </p>
    @if (heroDefaultData.heroContentMiddle.ctaDefault) {
    <maine-link-default
      [linkDefaultData]="heroDefaultData.heroContentMiddle.ctaDefault"
    ></maine-link-default
    >} @else if (heroDefaultData.heroContentMiddle.ctaArrow) {
    <maine-link-arrow
      [linkArrowData]="heroDefaultData.heroContentMiddle.ctaArrow"
    ></maine-link-arrow>
    }
  </div>
  <div class="ma-hero-default__content-end-container">
    <h4 [innerHTML]="safeContentEndText()"></h4>
    @if (heroDefaultData.heroContentEnd.ctaDefault) {
    <maine-link-default
      [linkDefaultData]="heroDefaultData.heroContentEnd.ctaDefault"
    ></maine-link-default>
    } @else if(heroDefaultData.heroContentEnd.ctaArrow){
    <maine-link-arrow
      [linkArrowData]="heroDefaultData.heroContentEnd.ctaArrow"
    ></maine-link-arrow>
    }
  </div>
</div>
