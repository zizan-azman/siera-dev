<a
  [routerLink]="linkArrowData.url"
  class="ma-link-arrow ma-link-arrow--{{
    linkArrowData.type
  }} ma-link-arrow--color-{{ linkArrowData.color }}"
>
  <span
    class="{{
      linkArrowData.linkArrowText.textSize === 'default' ? 'cta-1' : 'cta-2'
    }}"
    >{{ linkArrowData.linkArrowText.text }}</span
  >
  <svg width="24" height="24" class="ma-icon">
    <use
      xlink:href="
        maine-assets/svgs/icon/sprite.svg#arrow-narrow-right
      "
    ></use>
  </svg>
</a>
