<a
  [routerLink]="linkDefaultData.url"
  class="ma-link ma-link--{{ linkDefaultData.type }} ma-link--color-{{
    linkDefaultData.color
  }}"
>
  @if(linkDefaultData.linkDefaultPrefixIcon){
  <svg width="24" height="24" class="ma-icon">
    <use
      [attr.xlink:href]="
        'maine-assets/svgs/icon/sprite.svg' +
        linkDefaultData.linkDefaultPrefixIcon.iconPath
      "
    ></use>
  </svg>
  } @if(linkDefaultData.linkDefaultText){
  <span
    class="{{
      linkDefaultData.linkDefaultText.textSize === 'default' ? 'cta-1' : 'cta-2'
    }}"
    >{{ linkDefaultData.linkDefaultText.text }}</span
  >} @if(linkDefaultData.linkDefaultSuffixIcon){
  <svg width="24" height="24" class="ma-icon">
    <use
      [attr.xlink:href]="
        'maine-assets/svgs/icon/sprite.svg' +
        linkDefaultData.linkDefaultSuffixIcon.iconPath
      "
    ></use></svg
  >}
</a>
