<a
  [routerLink]="cardDefaultData.cardURL"
  class="ma-card ma-card--{{ cardDefaultData.cardType }}"
>
  <img
    class="ma-card__image"
    [ngSrc]="cardDefaultData.cardImage.path"
    [alt]="cardDefaultData.cardImage.alt"
    width="720"
    height="720"
    [priority]="cardDefaultData.cardImage.priority"
  />
  <div class="ma-card__body">
    <div class="ma-card__info">
      @if(cardDefaultData.cardContentIcon){
      <maine-icon-chip
        [iconChipData]="cardDefaultData.cardContentIcon"
      ></maine-icon-chip>
      }
      <div class="ma-card__content">
        <div class="ma-card__content-title">
          {{ cardDefaultData.cardContentTitle.text }}
        </div>
        <p class="ma-card__content-paragraph">
          {{ cardDefaultData.cardContentBody.text }}
        </p>
      </div>
    </div>
    @if(cardDefaultData.cardContentCTA){
    <maine-link-arrow></maine-link-arrow>
    }
  </div>
</a>
