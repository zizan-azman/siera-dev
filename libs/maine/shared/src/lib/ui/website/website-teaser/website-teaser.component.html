<div class="ma-website-teaser ma-custom-grid-layout">
  <div class="ma-website-teaser__container">
    <h2 class="h3 ma-website-teaser__headline">
      {{ websiteTeaserConfig.headline }}
    </h2>
    <div class="ma-website-teaser__websites-container">
      @for(item of websiteTeaserConfig.cards; track item.title ){
      <maine-card-website [cardWebsiteConfig]="item"></maine-card-website>
      }
    </div>
  </div>
</div>
