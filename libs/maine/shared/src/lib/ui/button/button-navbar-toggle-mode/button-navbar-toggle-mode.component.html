<button
  class="ma-button-toggle-mode ma-button-toggle-mode--shadow"
  (click)="onToggleMode()"
>
  <svg width="24" height="24" class="ma-icon">
    <use
      [attr.xlink:href]="
        isDarkMode
          ? 'maine-assets/svgs/icon/sprite.svg#sun'
          : 'maine-assets/svgs/icon/sprite.svg#moon'
      "
    ></use>
  </svg>
</button>
